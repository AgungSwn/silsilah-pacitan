<style>
  :root{--bg:#efe4cf;--ink:#45361f;--acc:#a8823f;--g:#7d6240}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #app{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#fbf8f2}
  .splash{position:fixed;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 35%,#f7efdd,var(--bg) 60%,#dcc8a4);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;transition:opacity .4s}
  .splash.hide{opacity:0;pointer-events:none}
  .splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 10px 30px rgba(60,40,20,.28);animation:napas 2.4s ease-in-out infinite}
  .splash h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;line-height:1.1;margin:6px 0 0;font-weight:700}
  .splash h1 em{color:var(--acc);font-weight:600}
  .splash p{margin:0;font-size:15px;color:#6b5a40}
  .splash a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:10px;background:var(--g);color:#fff;text-decoration:none;font-weight:600}
  @keyframes napas{50%{transform:scale(1.04)}}
  @media (prefers-reduced-motion:reduce){.splash img{animation:none}.splash{transition:none}}
</style>
</head>
<body>
<div class="splash" id="splash" role="status">
  <img src="icons/icon-192.png" alt="">
  <h1>Silsilah Keluarga <em>Pacitan</em></h1>
  <p id="msg">Memuat silsilah…</p>
  <a id="direct" hidden>Buka langsung</a>
</div>
<iframe id="app" title="Silsilah Keluarga Pacitan" allow="clipboard-write; fullscreen"></iframe>
<script>
  // Alamat aplikasi Apps Script (URL /exec dari Deploy). Ganti di sini bila berubah.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzq68SeITz9e6slSeTRMlMvPZ3PN9PWm8vz4fs63PAkUB7_uVXhzx-xEbxFfFSeneO1/exec';

  const app = document.getElementById('app'), splash = document.getElementById('splash'),
        msg = document.getElementById('msg'), direct = document.getElementById('direct');
  direct.href = APP_URL;
  // Safari (iPhone, iPad, Mac) memblokir cookie Google di dalam bingkai sehingga muncul
  // "PERMISSION_DENIED". Di sana aplikasi dibuka langsung, bukan di dalam bingkai.
  const ua = navigator.userAgent;
  const isIOS = /iP(hone|ad|od)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isSafari = /^((?!chrome|chromium|crios|fxios|edg|android).)*safari/i.test(ua);
  if (isIOS || isSafari) {
    msg.textContent = 'Membuka aplikasi…';
    app.remove();
    setTimeout(() => location.replace(APP_URL), 700);
  } else {
    app.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 300));
    app.src = APP_URL;
  }
  // Bila lama tidak terbuka (mis. perlu masuk akun Google), tawarkan buka langsung.
  setTimeout(() => {
    if (!splash.classList.contains('hide')) {
      msg.textContent = 'Belum terbuka? Mungkin perlu masuk ke akun Google dulu.';
      direct.hidden = false;
    }
  }, 9000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
